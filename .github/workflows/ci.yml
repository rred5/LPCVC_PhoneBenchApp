name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      # requirements.txt pins the versions the API runs with on Vercel
      # (Pillow's version decides the bytes of prepared images).
      - run: pip install -r requirements.txt pytest
      - name: Server tests
        working-directory: server
        run: python -m pytest -q
      - name: Android harness tests
        working-directory: android
        run: python -m pytest -q test_accuracy_pilot.py test_accuracy_pilot_review.py

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Web tests
        working-directory: web
        run: node --test
